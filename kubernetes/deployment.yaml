apiVersion: apps/v1
kind: Deployment
metadata:
  name: cove-user-backend
  namespace: ${NAMESPACE}
  labels:
    app: cove-user-backend
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cove-user-backend
  template:
    metadata:
      labels:
        app: cove-user-backend
        tier: backend
      annotations:
        prometheus.io/scrape: "true"  # Enable scraping
        prometheus.io/port: "8090"
    spec:
      hostname: cove-user-backend-host
      containers:
      - name: cove-user-backend-container
        image: ${ECR_REPO_URL}:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 8090
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 250m
            memory: 1024Mi